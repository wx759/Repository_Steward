services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repository-steward-backend
    env_file:
      - ./backend/config/.env
    environment:
      WORKSPACE_ROOT: /workspaces
      DEFAULT_WORKSPACE_RELATIVE_PATH: ${DEFAULT_WORKSPACE_RELATIVE_PATH:-codeAgent}
    init: true
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
      - ${WORKSPACE_HOST_ROOT:-..}:/workspaces
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repository-steward-frontend
    init: true
    ports:
      - "7788:7788"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7788').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
